[project]
name = "option-pricing-heston-fourier"
version = "0.1.0"
description = "European option pricing under Black–Scholes and Heston: Monte Carlo and Fourier (Carr–Madan FFT) methods."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/option_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
